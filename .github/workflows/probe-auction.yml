name: probe-auction
on:
  push:
    branches: [probe-auction]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: mkdir -p out && AUCTION_SHOTS=out AUCTION_TIMEOUT=1500 AUCTION_BUDGET=120 AUCTION_DIAG_ADDR=1 node tools/auction.js out/auction_raw.json pipeline/cache/auction_state.json
      - run: node -e "const o=require('./out/auction_raw.json');console.log(JSON.stringify({ok:o.ok,err:o.err,used:o.used,courts:o.courts,searches:o.searches,n:o.items.length},null,1))"
      - uses: actions/upload-artifact@v4
        with:
          name: auction
          path: out/
