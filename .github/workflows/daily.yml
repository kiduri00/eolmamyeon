name: 매일 데이터 갱신

on:
  schedule:
    - cron: "40 21 * * *"   # 매일 06:40 (서울)
  workflow_dispatch:
    inputs:
      report:
        description: "월간 리포트도 지금 만들기 (1이면)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 도구 설치
        run: |
          pip install shapely==2.0.6 numpy==2.1.3
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 이전 원자료 복원(작년 전월세 등)
        uses: actions/cache@v4
        with:
          path: pipeline/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: 갱신 · 빌드
        env:
          FORCE_REPORT: ${{ github.event.inputs.report }}
        run: bash tools/daily.sh
      - name: 바뀐 것만 커밋
        run: |
          git config user.name "jaegaebal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public pipeline src
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 10; done; exit 1
